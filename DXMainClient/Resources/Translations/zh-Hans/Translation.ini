INI:Missions:001:LongDescription=Avaiable Commandos: 3@@ @@Available Difficults:@@ Normal - No Fog / Two initial Commandos @@ Hard- No fog @@ Apocalypse - Fog of war @@Choose the way for the initial invasion and Secure the Tiberium Crater in the north of French.@@ Dev Commnent/SCIPCION: This mission use a lot of realistic mechanics, and realistic behavior for the units, my first mission with choices ingame, small but with many ways to play.
