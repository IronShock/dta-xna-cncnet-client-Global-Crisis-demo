INI:Database:Himars:Description=[FONT:7]The [FONT:6][U]M142 High Mobility Artillery Rocket System (HIMARS)[/U][FONT:7] is a light multiple rocket launcher developed in the late 1990s for the United States Army and mounted on a standard U.S. Army [FONT:6][U]Family of Medium Tactical Vehicles (FMTV) M1140 truck frame.[/U][FONT:7]\@\@The HIMARS carries one pod with either [FONT:6][U]six Guided Multiple Launch Rocket System (GMLRS) rockets[/U][FONT:7] or [FONT:6][U]one Army Tactical Missile System (ATACMS) missile.[/U][FONT:7] It is based on the U.S. Army's FMTV five-ton truck, and is capable of launching all rockets in the Multiple Launch Rocket System Family of Munitions. HIMARS ammunition pods are interchangeable with the [FONT:6][U]M270 MLRS.[/U][FONT:7] It has a single pod, as opposed to the standard two for the M270 and its variants.\@\@The launcher can be transported by C-17 Globemaster, C-5 Galaxy, and Lockheed C-130 Hercules aircraft. The FMTV truck that transports the HIMARS was initially produced by [FONT:6][U]Armor Holdings Aerospace and Defense Group Tactical Vehicle Systems Division,[/U][FONT:7] the original equipment manufacturer of the FMTV. It was produced by the [FONT:6][U]Oshkosh Corporation[/U][FONT:7] from 2010 to 2017. with all units since then being manufactured by [FONT:6][U]Lockheed Martin's Missiles and Fire Control division.[/U][FONT:6]\@\@---------- STATUS ----------[FONT:7]\@\@Strength =\@\@Cost =\@\@Armor =\@\@Speed =\@\@
