INI:Missions:RU01:Description=GC: 01 Восток Rising
INI:Missions:RU01:LongDescription=Mission Difficulty: Normal @@Available Difficults:@@ Normal - @No Enemy reinforcements.@@ Hard- @Enemy reinforcements.@@ Apocalypse - @Heavy Enemy reinforcements, include real final.@Limited Save/Load function@@ Apocalypse ++ - @Only for experts @No Save/Load Function @Operation timer @@Commander, the time has come to crush the enemy forces on their homeland, in the heart of United States!@@Your objective is to secure the area around the Pentagon to prepare for its capture. Your orders are to destroy all enemy forces and take control of the Pentagon. Do not destroy the building.@@ Dev Comments/SCIPCION: This is mission my best work so far with the script/external script and the help of Theker, using the system of choices in a great way, one of my latest maps, made with experience. @666
