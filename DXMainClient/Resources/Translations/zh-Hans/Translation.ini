INI:Missions:E10:LongDescription=Mission Difficulty: Apocalypse @@ Available Difficults:@@ Normal - MCV, No Fog of War @@ Hard- MCV, Fog of War @@ Apocalypse - Delayed MCV, Fog of war and real final @@ @@Commander, It is a critical situation, these celestial machines are harvesting tiberium around the planet. we must retake the battlefield and control the tiberium fields. Our allies are trying to eradicate them without notable success. the machines use extremely dangerous weapons, take your precautions.@@ Dev Commnent/SCIPCION: This mission shows the most destructive part of the mod, how insane are scrins and how destroyed is the world, one of the first missions made, first versions were so lag, this version is extremely optimized.
