INI:Missions:11:LongDescription=Available Difficults:@@ Hard- Visible Spots @@ Apocalypse - No visible spots @@Destroy all the psionic emitters in the area before fast as possible, rescuee and evacuate the missing soldiers areound the city. care with the mutans and tiberium creatures, those are destroying the city.@@ Dev Commnent/SCIPCION: This mission made by me and Yazanus is a nice relaxing mission, not much to comment, one of my first missions scripting and learning about missions.
