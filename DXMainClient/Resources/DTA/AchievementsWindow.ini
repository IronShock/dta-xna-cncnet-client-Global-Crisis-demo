; ============================================================
; Achievements window layout configuration (full screen).
;
; Every part of the window is editable here, mirroring the
; campaign selector's ini pattern. The values shown are the
; built-in defaults, so you only need to change what you want.
;
; Sections:
;   [AchievementsWindow]  window size / background
;   [lblTitle]            window title label
;   [scrollPanel]         scrollable two-column grid area
;   [lblNoAchievements]   text shown when no achievements exist
;   [btnClose]            Back button
;   [AchievementsGrid]    achievement cell metrics
; ============================================================

[AchievementsWindow]
Size=1280,800
;BackgroundTexture=campaignbackground.png

[lblTitle]
Location=40,26
FontIndex=2
;Text=Achievements

[scrollPanel]
Location=40,78
Size=1200,652
ScrollStep=40
;SolidColorBackgroundTexture=0,0,0,110
;DrawBorders=yes
;BorderColor=185,200,215,255

[lblNoAchievements]
Location=60,98
FontIndex=1

[btnClose]
Location=40,755
Size=133,23
;Text=Back
;IdleTexture=idle_button.png
;HoverTexture=hover_button.png

; Grid cell metrics. The panel width minus ColumnGap is divided
; between the two columns.
[AchievementsGrid]
CellHeight=120
ColumnGap=20
RowGap=16
