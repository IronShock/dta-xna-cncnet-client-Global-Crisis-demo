; Chapter buttons each apply a different battle INI configuration.
; Each entry is "DisplayName,BattleIniFile[,WorldMapFile[,OverlayImage[,OverlayScale]]]".
; The optional third field is the world map texture shown on the globe when that
; chapter is selected (a file in the Resources folder, default "worldmap.png").
; The optional fourth field is an image layered on top of the globe (also a file in
; the Resources folder). The optional fifth field is its scale as a percentage
; relative to the globe's disc (default 100).
; Buttons whose battle file has no missions are disabled.
[ChapterButtons]
0=Tutorial,INI/BattleStory.ini,worldmap.png
1=First Era,INI/BattleStory2.ini,worldmap1.png
2=Second Era,INI/BattleStory3.ini,worldmap2.png
3=Third Era,INI/BattleStory4.ini,worldmap3.png

; Sub-chapter group navigation shown in the mission list.
; Each entry is "index=groupkey,displayname[,iconname]".
; Missions whose Group key equals groupkey are listed under that group.
; Display names can be translated via Translation.ini with key Client:CampaignGroups:<groupkey>.
[CampaignGroups]
0=Russia,Russia Campaign
1=China,China Campaign
2=USA,USA Campaign
3=Scrin,Scrin Campaign

; Warnings shown before launching missions on the highest difficulty levels.
; The APOC (third) difficulty warns only the first time the player plays it;
; the APOC++ (fourth, requires AdditionalDifficulty=yes on the mission) warns
; on every launch. Use @@ to insert a line break in the text. Edit the text
; below to customize it.
[DifficultyWarnings]
WarningTitle=Difficulty Warning
ApocFirstTimeWarningText=这个难度不适合第一次游玩的玩家
ApocPlusPlusWarningText=准备好迈向地狱了吗

; Warning shown when clicking Start while the selected mission still has an
; unfinished game (continue save). Use @@ for a line break.
[ContinueGameWarning]
WarningTitle=Unfinished Game
WarningText=You have an unfinished game for this mission.@@Starting a new game will abandon your previous progress. Are you sure you want to continue?
