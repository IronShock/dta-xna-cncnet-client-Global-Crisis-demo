; ============================================================
; Campaign / achievement slide-in notification layout.
;
; The notifications slide in from the right edge of the window,
; stay for a few seconds, then slide out. Campaign cards are
; pinned to the top; achievement cards stack below them.
;
; Sections:
;   [Notifications]       shared card metrics / colours / timings
;   [CampaignCompleted]   campaign card specifics
;   [AchievementUnlocked] achievement card specifics
;
; Colours are "R,G,B" or "R,G,B,A". Leave a key out to use the
; built-in default shown here.
; ============================================================

[Notifications]
Width=380
ContentHeight=88
Padding=14
IconSize=64
IconGap=12
RightMargin=20
TopMargin=20
SlotGap=8
SlideDuration=0.5
HoldDuration=5.0
BackgroundColor=0,0,0,205
BorderColor=185,200,215,255
AccentCampaignColor=214,175,54,255
AccentAchievementColor=80,200,120,255
AccentBarWidth=3
HeaderFontIndex=1
NameFontIndex=6
SubFontIndex=1
PointFilterIcons=true
MaxToasts=4

[CampaignCompleted]
;Text shown above the campaign name; leave empty to use the localized default
Header=
ShowBanner=true
BannerMaxHeight=110

[AchievementUnlocked]
Header=
