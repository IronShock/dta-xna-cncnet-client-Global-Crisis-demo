; ============================================================
; Database window layout configuration (full screen).
;
; This file drives the whole Database window, exactly like
; CampaignStory.ini drives the campaign selector. Every part of
; the window is editable here; the values shown are the built-in
; defaults, so you only need to change what you want.
;
; Sections:
;   [DatabaseWindow]  window size, background, content INI name
;   [TreePanel]       left table-of-contents panel (position, node
;                     height/spacing/indent, colors, fonts, arrows)
;   [ContentPanel]    article viewer stack defaults (origin, widths,
;                     gaps, bottom margin)
;   [lblTitle]        article title label
;   [gallery]         image gallery (uncomment to place it manually)
;   [richTextBlock]   article body (uncomment to place it manually)
;   [btnClose]        Back button
;   [pnlZoom]         full-screen overlay when clicking a gallery image
; ============================================================

[DatabaseWindow]
Size=1280,800
;BackgroundTexture=campaignbackground.png
;ContentIni=Database.ini

; ---- Article viewer (right side) ----
; The article stack auto-arranges below the title label. To move the whole
; stack, edit [lblTitle] Location. To fix the gallery and body at exact
; positions, uncomment [gallery] and [richTextBlock] below.

[ContentPanel]
X=380
Y=60
Width=860
GalleryHeight=260
TitleToGalleryGap=44
GalleryToTextGap=12
BottomMargin=60

[lblTitle]
Location=380,60
FontIndex=2

[gallery]
;Location=380,104
;Size=860,260
;ArrowSize=30
;ImagePadding=20
;SolidColorBackgroundTexture=0,0,0,120
;DrawBorders=yes
;BorderColor=185,200,215,255

[richTextBlock]
;Location=380,376
;Size=860,364
;FontIndex=1
;ScrollStep=40
;ImageMargin=8
;ParagraphSpacing=12
;ScrollbarWidth=4
;ScrollbarColor=190,190,190,220
;ScrollbarBackgroundColor=0,0,0,90
;SolidColorBackgroundTexture=0,0,0,110
;DrawBorders=yes
;BorderColor=185,200,215,255

[btnClose]
Location=380,755
Size=133,23
;Text=Back
;IdleTexture=idle_button.png
;HoverTexture=hover_button.png

[pnlZoom]
; Full-screen overlay shown when clicking a gallery image.
;SolidColorBackgroundTexture=0,0,0,200

; ---- Table of contents tree (left side) ----
[TreePanel]
X=30
Y=90
Width=320
BottomMargin=50
NodeHeight=24
RowSpacing=2
IndentPerDepth=18
NodeFontIndex=1
ScrollWheelStep=20
IdleColor=40,40,40,220
HoverColor=60,60,60,240
SelectedColor=85,85,85,240
TextColor=230,230,230,255
ExpandedArrow=v
CollapsedArrow=>
