; ============================================================
; Database content definition.
; Each section is a tree node.
;   Type      = Category (folder) or Article (leaf)
;   Text      = display name in the tree / title of the article
;   Parent    = key name of the parent category (empty = root)
;   Image1..N = gallery images shown above the article (switch with arrows)
;   Description      = body text, paragraphs separated by @@; put [IMG:filename]
;                     anywhere in the text to insert an image at that position
;
; Font control (optional, article sections only):
;   TitleFontIndex = font index used for the article title
;   BodyFontIndex  = default font index used for the body paragraphs
;   [FONT:n]       = placed in Description to switch the font of the text that
;                    follows (until the next [FONT:n]). It is INLINE: it changes
;                    the font without inserting a line break, so surrounding text
;                    keeps flowing on the same line. Use "@@" to separate
;                    paragraphs and "[IMG:file]" to insert images (both break).
;
; The [Database] section can set the default window title shown before an
; article is selected.
; ============================================================

[Database]
Title=Database

; ---- Root Categories ----
[Intro]
Type=Category
Text=Basic Introduction

[USA]
Type=Category
Text=USA

[Russia]
Type=Category
Text=Russia

; ---- Category Section ----
[USAArm]
Type=Category
Text=Arsenals
Parent=USA

[USAVehicle]
Type=Category
Text=Vehicles
Parent=USAArm

; ---- Article Section ----
[Himars]
Type=Article
Text=Himars
Parent=USAVehicle
TitleFontIndex=2
BodyFontIndex=5
Image1=Himars1.png
Description=[FONT:2]Overview@@[FONT:5]The Himars is a powerful rocket artillery unit.@@[IMG:worldmap.png]@@[FONT:2]Tactical use@@[FONT:5]Use it to support your ground forces from a safe distance.
